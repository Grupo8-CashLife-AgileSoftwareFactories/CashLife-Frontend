name: Deploy to Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm deployment to release'
        required: true
        default: 'no'

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-to-release:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
      
      - name: Build project
        run: npm run build
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Update release branch
        run: |
          git checkout release
          git merge develop --no-ff -m "Deploy: Merge develop to release after successful CI"
          git push origin release
          echo "✅ Release branch updated successfully"
      
      - name: Summary
        run: |
          echo "🚀 Deployment to release completed!"
          echo "Next step: Go to Actions and run 'Deploy to Production' workflow"
