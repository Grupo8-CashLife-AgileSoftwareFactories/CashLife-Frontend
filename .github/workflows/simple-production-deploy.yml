name: Simple Production Deploy

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build for production
        run: npm run build
      
      - name: Create or Update Pull Request
        run: |
          echo "Checking for existing PR..."
          
          # Verificar si existe un PR
          PR_EXISTS=$(gh pr list --base main --head release --json number --jq 'length > 0' 2>/dev/null || echo "false")
          
          if [ "$PR_EXISTS" = "true" ]; then
            echo "Updating existing PR..."
            PR_NUMBER=$(gh pr list --base main --head release --json number --jq '.[0].number')
            gh pr edit $PR_NUMBER --body "🚀 **Production deployment ready**

Latest changes from release branch are ready for production.

**Build Status:** ✅ Validated successfully  
**Updated:** $(date)  
**Commit:** ${{ github.sha }}

Ready to merge for production deployment!"
            echo "✅ Updated PR #$PR_NUMBER"
          else
            echo "Creating new PR..."
            gh pr create \
              --title "🚀 Deploy release to production" \
              --body "🚀 **Production deployment ready**

Latest changes from release branch are ready for production.

**Build Status:** ✅ Validated successfully  
**Created:** $(date)  
**Commit:** ${{ github.sha }}

Ready to merge for production deployment!" \
              --base main \
              --head release
            echo "✅ Created new PR"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-to-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    steps:
      - name: Deployment notification
        run: |
          echo "🚀 Production deployment initiated!"
          echo "PR #${{ github.event.pull_request.number }} merged to main"
          echo "Deployment will be handled by Render auto-deploy"
